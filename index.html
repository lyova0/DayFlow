<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dayflow</title>
  <meta name="theme-color" content="#f4f6f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dayflow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <nav class="nav" aria-label="Основная навигация">
    <a href="#/home" data-route="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Главная</span>
    </a>
    <a href="#/schedule" data-route="schedule">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Расписание</span>
    </a>
    <a href="#/study" data-route="study">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5zM4 5.5v16M8 8h8"/></svg>

    </a>
    <a href="#/food" data-route="food">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-3-2-8-1-8 4 0 5 3 10 5 10 1 0 2-.7 3-.7s2 .7 3 .7c2 0 5-5 5-10 0-5-5-6-8-4zM12 7c0-2 1-3.5 3-4"/></svg>
      <span>Питание</span>
    </a>
    <a href="#/more" data-route="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span>Ещё</span>
    </a>
  </nav>

  <div id="sheet-root" class="sheet-root"></div>
  <div id="auth-root" class="auth-root"></div>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
